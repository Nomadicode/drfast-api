[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "drfast-api"
version = "0.1.0"
description = "DRF-inspired async APIs for FastAPI and Tortoise ORM"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "DRFast API contributors" }]
classifiers = [
	"Development Status :: 2 - Pre-Alpha",
	"Framework :: FastAPI",
	"Framework :: AsyncIO",
	"License :: OSI Approved :: MIT License",
	"Programming Language :: Python :: 3 :: Only",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
]
dependencies = [
	"fastapi>=0.115,<1",
	"fastapi-users>=14,<15",
	"email-validator>=2.2,<3",
	"pydantic>=2.7,<3",
	"pydantic-settings>=2.3,<3",
	"tortoise-orm>=1,<2",
	"uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29,<1"]
dev = [
	"httpx>=0.27,<1",
	"pytest>=8,<9",
	"pytest-asyncio>=0.23,<1",
	"ruff>=0.8,<1",
	"mypy>=1.13,<2",
	"bandit>=1.7,<2",
	"pip-audit>=2.7,<3",
]

[project.scripts]
drfast = "drfast.cli:main"

[project.urls]
Documentation = "https://github.com/drfast-api/drfast-api#readme"
Issues = "https://github.com/drfast-api/drfast-api/issues"
Source = "https://github.com/drfast-api/drfast-api"

[tool.hatch.build.targets.wheel]
packages = ["src/drfast"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

